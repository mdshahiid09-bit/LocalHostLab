name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build Debug APK & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7 > build.log 2>&1 || (cat build.log && exit 1)
          chmod +x gradlew
          ls -lh gradle/wrapper/

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace --info > build.log 2>&1 || (cat build.log && exit 1)

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalHostLab-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: LocalHostLab v1.0.${{ github.run_number }}
          body: |
            ### LocalHostLab v1.0.${{ github.run_number }}
            Automated Android Build & Release

            - Commit: ${{ github.sha }}
            - Workflow Run: #${{ github.run_number }}
            - Download `app-debug.apk` below to test on your Android device.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report Build Failure to Issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let logContent = 'No build.log file was generated (failure occurred before build step).';
            if (fs.existsSync('build.log')) {
              try {
                const fullLog = fs.readFileSync('build.log', 'utf8');
                logContent = fullLog.length > 50000 ? fullLog.slice(-50000) : fullLog;
              } catch (e) {
                logContent = 'Failed to read build.log: ' + e.message;
              }
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI Build Failure: Run #${context.runNumber} (${context.sha.substring(0, 7)})`,
              body: `### Build Failure on Run #${context.runNumber}\n**Commit:** ${context.sha}\n**Workflow:** ${context.workflow}\n\n#### Log Output:\n\`\`\`text\n${logContent}\n\`\`\``
            });
