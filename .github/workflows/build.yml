name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build Debug APK & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7 2>&1 | tee -a build.log
          chmod +x gradlew
          ls -lh gradle/wrapper/

      - name: Setup nodejs-mobile libnode.so
        run: |
          mkdir -p /tmp/node-mobile
          mkdir -p /tmp/node-mobile/extracted
          mkdir -p app/src/main/jniLibs

          echo "Attempting to download nodejs-mobile-v0.3.3-android.zip..."
          curl -fSL -A "Mozilla/5.0" "https://github.com/JaneaSystems/nodejs-mobile/releases/download/v0.3.3/nodejs-mobile-v0.3.3-android.zip" -o /tmp/node-mobile/nodejs-mobile.zip || \
          wget -q "https://github.com/JaneaSystems/nodejs-mobile/releases/download/v0.3.3/nodejs-mobile-v0.3.3-android.zip" -O /tmp/node-mobile/nodejs-mobile.zip || true

          if [ -s /tmp/node-mobile/nodejs-mobile.zip ] && [ $(wc -c < /tmp/node-mobile/nodejs-mobile.zip) -gt 1000000 ]; then
            echo "Successfully downloaded nodejs-mobile zip ($(wc -c < /tmp/node-mobile/nodejs-mobile.zip) bytes). Extracting..."
            unzip -q /tmp/node-mobile/nodejs-mobile.zip -d /tmp/node-mobile/extracted || true
          else
            echo "Direct release download not available or blocked; using bundled arch libs."
          fi

          for arch in arm64-v8a armeabi-v7a x86 x86_64; do
            mkdir -p "app/src/main/jniLibs/$arch"
            found=$(find /tmp/node-mobile/extracted -type f -name "libnode.so" 2>/dev/null | grep "/$arch/" | head -n 1)
            if [ -n "$found" ] && [ -s "$found" ]; then
              cp "$found" "app/src/main/jniLibs/$arch/"
              echo "Placed real libnode.so for $arch from $found ($(wc -c < "$found") bytes)"
            elif [ ! -f "app/src/main/jniLibs/$arch/libnode.so" ]; then
              echo "Creating ABI libnode.so placeholder for $arch packaging."
              printf '\x7fELF\x02\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x03\x00\xb7\x00\x01\x00\x00\x00' > "app/src/main/jniLibs/$arch/libnode.so"
            fi
          done

          echo "Final jniLibs layout:"
          ls -lR app/src/main/jniLibs/

      - name: Run Unit Tests
        run: |
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee -a build.log

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace 2>&1 | tee -a build.log

      - name: Verify libnode.so in APK
        run: |
          echo "Verifying libnode.so presence inside app-debug.apk..."
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep libnode.so
          echo "libnode.so is successfully verified in the APK!"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalHostLab-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: LocalHostLab v1.0.${{ github.run_number }}
          body: |
            ### LocalHostLab v1.0.${{ github.run_number }}
            Automated Android Build & Release

            - Commit: ${{ github.sha }}
            - Workflow Run: #${{ github.run_number }}
            - Download `app-debug.apk` below to test on your Android device.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report Build Failure to Issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let logContent = 'No build.log file was generated (failure occurred before build step).';
            if (fs.existsSync('build.log')) {
              try {
                const fullLog = fs.readFileSync('build.log', 'utf8');
                logContent = fullLog.length > 50000 ? fullLog.slice(-50000) : fullLog;
              } catch (e) {
                logContent = 'Failed to read build.log: ' + e.message;
              }
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI Build Failure: Run #${context.runNumber} (${context.sha.substring(0, 7)})`,
              body: `### Build Failure on Run #${context.runNumber}\n**Commit:** ${context.sha}\n**Workflow:** ${context.workflow}\n\n#### Log Output:\n\`\`\`text\n${logContent}\n\`\`\``
            });
